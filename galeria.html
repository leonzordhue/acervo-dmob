<!DOCTYPE html>
<!-- AKE/UFT-1.0 | BUILD: ACERVO-20260803 | IC: 1.0 | MÓDULO: GALERIA_ACERVO -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acervo Visual DMOB</title>
<style>
  :root{--azul:#002D72;--verde:#2D8540;--cinza:#5a6472;--bg:#f4f6f9;--borda:#dde3ea}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:#1c2430}
  header{background:var(--azul);color:#fff;padding:0.9rem 1.2rem;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap}
  header h1{font-size:1rem;font-weight:700;letter-spacing:0.02em}
  header .sub{font-size:0.72rem;opacity:0.85}
  header a{color:#fff;font-size:0.75rem;text-decoration:none;border:1px solid rgba(255,255,255,.4);padding:0.3em 0.8em;border-radius:99px}
  main{max-width:1200px;margin:0 auto;padding:1.2rem}
  .crumb{font-size:0.8rem;color:var(--cinza);margin-bottom:1rem}
  .crumb a{color:var(--azul);text-decoration:none;font-weight:600}
  .grupo-titulo{font-size:0.78rem;font-weight:700;color:var(--azul);letter-spacing:0.06em;text-transform:uppercase;margin:1.4rem 0 0.6rem;border-bottom:2px solid var(--borda);padding-bottom:0.3rem}
  .pastas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0.8rem}
  .pasta{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
  .pasta:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,45,114,.12)}
  .pasta img{width:100%;height:130px;object-fit:cover;display:block;background:#e8ecf1}
  .pasta .info{padding:0.55rem 0.7rem}
  .pasta .nome{font-size:0.8rem;font-weight:700;line-height:1.25}
  .pasta .meta{font-size:0.68rem;color:var(--cinza);margin-top:0.2rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0.6rem}
  .grid a{display:block;border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--borda)}
  .grid img{width:100%;height:130px;object-fit:cover;display:block}
  .grid .leg{font-size:0.62rem;color:var(--cinza);padding:0.25rem 0.4rem}
  .vazio{padding:2rem;text-align:center;color:var(--cinza);font-size:0.9rem}
  footer{padding:1.5rem;text-align:center;font-size:0.68rem;color:var(--cinza)}
</style>
</head>
<body>
<header>
  <h1>Acervo Visual DMOB</h1>
  <span class="sub">Departamento Rodoviário · SEINFRA-AM</span>
  <a href="https://leonzordhue.github.io/seinfra-hub/">← voltar ao hub</a>
</header>
<main id="main"><div class="vazio">Carregando…</div></main>
<footer>Fotos de campo do DMOB. Resolução web — originais no acervo interno do departamento.</footer>
<script>
(async function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const qs = new URLSearchParams(location.search);
  const alvo = qs.get("p");
  let pastas = [], files = {};
  try {
    [pastas, files] = await Promise.all([
      fetch("acervo_fotos.json").then(r=>r.json()),
      fetch("fotos_files.json").then(r=>r.json()),
    ]);
  } catch(e) {
    $("#main").innerHTML = '<div class="vazio">Não foi possível carregar o acervo.</div>';
    return;
  }
  if (alvo) {
    const p = pastas.find(x => x.pasta === alvo);
    const lst = files[alvo] || [];
    if (!p || !lst.length) { $("#main").innerHTML = '<div class="vazio">Pasta não encontrada.</div>'; return; }
    document.title = (p.ramal || p.chave) + " — Acervo DMOB";
    $("#main").innerHTML = `
      <div class="crumb"><a href="galeria.html">Acervo</a> › ${esc(p.rodovia||"")} › <strong>${esc(p.ramal || p.chave)}</strong>
        ${p.municipio ? " · " + esc(p.municipio) : ""} · ${lst.length} foto${lst.length!==1?"s":""}</div>
      <div class="grid">${lst.map(f => `
        <a href="fotos/${esc(alvo)}/${esc(f.f)}" target="_blank" rel="noopener" title="${esc(f.d||"")}">
          <img loading="lazy" src="thumbs/${esc(alvo)}/${esc(f.f)}" alt="">
          <div class="leg">${esc(f.d||"sem data")}</div>
        </a>`).join("")}
      </div>`;
    return;
  }
  // indice geral agrupado por rodovia
  const grupos = {};
  pastas.forEach(p => { (grupos[p.rodovia || "Outros"] = grupos[p.rodovia || "Outros"] || []).push(p); });
  const ordem = Object.keys(grupos).sort((a,b) => {
    const pa = a.startsWith("_"), pb = b.startsWith("_");
    if (pa !== pb) return pa ? 1 : -1;
    return a.localeCompare(b, "pt-BR");
  });
  $("#main").innerHTML = ordem.map(gr => `
    <div class="grupo-titulo">${esc(gr.replace(/^_/,""))} <span style="font-weight:500;color:var(--cinza)">(${grupos[gr].reduce((s,p)=>s+p.n_fotos,0)} fotos)</span></div>
    <div class="pastas">${grupos[gr].sort((a,b)=>b.n_fotos-a.n_fotos).map(p => `
      <a class="pasta" href="galeria.html?p=${encodeURIComponent(p.pasta)}">
        <img loading="lazy" src="${esc(p.capa)}" alt="">
        <div class="info">
          <div class="nome">${esc(p.ramal || p.chave.split(" / ").pop())}</div>
          <div class="meta">${p.municipio ? esc(p.municipio)+" · " : ""}${p.n_fotos} foto${p.n_fotos!==1?"s":""}</div>
        </div>
      </a>`).join("")}
    </div>`).join("");
})();
</script>
</body>
</html>
